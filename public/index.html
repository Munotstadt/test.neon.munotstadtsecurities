<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Security Master Admin</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  input, button { font-size: 15px; padding: 8px; margin: 4px 0; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; background: #111; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; }
  button:hover { background: #333; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px; max-width: 360px; margin: 80px auto; }
  .error { color: #c00; font-size: 14px; }
  .hidden { display: none; }
  .row-actions button { padding: 4px 8px; font-size: 12px; margin-right: 4px; }
  table input { width: 90px; font-size: 12px; padding: 4px; margin: 0; }
  table th { white-space: nowrap; }
</style>
</head>
<body>

<!-- LOGIN SCHRITT 1 -->
<div id="loginCard" class="card">
  <h1>Anmelden</h1>
  <input id="username" type="text" placeholder="Benutzername" />
  <input id="password" type="password" placeholder="Passwort" />
  <button onclick="login()">Weiter</button>
  <p id="loginError" class="error"></p>
</div>

<!-- LOGIN SCHRITT 2: 2FA -->
<div id="totpCard" class="card hidden">
  <h1>2FA-Code eingeben</h1>
  <input id="totpToken" type="text" placeholder="6-stelliger Code" maxlength="6" />
  <button onclick="verifyTotp()">Bestätigen</button>
  <p id="totpError" class="error"></p>
</div>

<!-- HAUPTANSICHT -->
<div id="app" class="hidden">
  <h1>Security Master</h1>
  <button onclick="logout()">Abmelden</button>

  <h3>Neuer Eintrag</h3>
  <input id="security_name" placeholder="Name (Pflichtfeld)" />
  <input id="isin" placeholder="ISIN" />
  <input id="ticker" placeholder="Ticker" />
  <input id="valor" placeholder="Valor" />
  <input id="currency" placeholder="Währung" />
  <input id="collector" type="number" placeholder="Collector" />
  <input id="dashboard_grouping" type="number" placeholder="Dashboard Grouping" />
  <input id="instrument" type="number" placeholder="Instrument" />
  <input id="portfolio_grouping" type="number" placeholder="Portfolio Grouping" />
  <input id="date_launch" type="date" placeholder="Date Launch" />
  <input id="date_terminated" type="date" placeholder="Date Terminated" />
  <input id="status" type="number" placeholder="Status" />
  <input id="comments" placeholder="Kommentar" />
  <button onclick="createEntry()">Hinzufügen</button>

  <div style="overflow-x:auto;">
  <table id="table">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>ISIN</th><th>Ticker</th><th>Valor</th><th>Währung</th>
        <th>Collector</th><th>Dashboard Grp.</th><th>Instrument</th><th>Portfolio Grp.</th>
        <th>Launch</th><th>Terminated</th><th>Status</th><th>Kommentar</th><th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  </div>
</div>

<script>
const API_BASE = "/api";

let pendingUserId = null;

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  document.getElementById("loginError").textContent = "";
  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById("loginError").textContent = data.error;
      return;
    }
    pendingUserId = data.userId;
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("totpCard").classList.remove("hidden");
  } catch (err) {
    document.getElementById("loginError").textContent =
      "Verbindungsfehler: " + err.message + " (API_BASE: " + API_BASE + ")";
  }
}

async function verifyTotp() {
  const token = document.getElementById("totpToken").value;
  const res = await fetch(`${API_BASE}/verify-2fa`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ userId: pendingUserId, token }),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById("totpError").textContent = data.error;
    return;
  }
  document.getElementById("totpCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadData();
}

async function logout() {
  await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
  location.reload();
}

const FIELDS = [
  "security_name", "isin", "ticker", "valor", "currency",
  "collector", "dashboard_grouping", "instrument", "portfolio_grouping",
  "date_launch", "date_terminated", "status", "comments",
];

async function loadData() {
  try {
    const res = await fetch(`${API_BASE}/security-master`, { credentials: "include" });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert("Fehler beim Laden: " + (err.error || res.status));
      return;
    }
    const rows = await res.json();
    const body = document.getElementById("tableBody");
    body.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.dataset.id = r.security_id;
      const dateVal = v => (v ? String(v).slice(0, 10) : "");
      tr.innerHTML = `
        <td>${r.security_id}</td>
        <td><input data-field="security_name" value="${r.security_name ?? ""}"></td>
        <td><input data-field="isin" value="${r.isin ?? ""}"></td>
        <td><input data-field="ticker" value="${r.ticker ?? ""}"></td>
        <td><input data-field="valor" value="${r.valor ?? ""}"></td>
        <td><input data-field="currency" value="${r.currency ?? ""}"></td>
        <td><input data-field="collector" type="number" value="${r.collector ?? ""}"></td>
        <td><input data-field="dashboard_grouping" type="number" value="${r.dashboard_grouping ?? ""}"></td>
        <td><input data-field="instrument" type="number" value="${r.instrument ?? ""}"></td>
        <td><input data-field="portfolio_grouping" type="number" value="${r.portfolio_grouping ?? ""}"></td>
        <td><input data-field="date_launch" type="date" value="${dateVal(r.date_launch)}"></td>
        <td><input data-field="date_terminated" type="date" value="${dateVal(r.date_terminated)}"></td>
        <td><input data-field="status" type="number" value="${r.status ?? ""}"></td>
        <td><input data-field="comments" value="${r.comments ?? ""}"></td>
        <td class="row-actions">
          <button onclick="saveEntry(${r.security_id}, this)">Speichern</button>
          <button onclick="deleteEntry(${r.security_id})">Löschen</button>
        </td>
      `;
      body.appendChild(tr);
    });
  } catch (err) {
    alert("Verbindungsfehler beim Laden: " + err.message);
  }
}

function readRow(tr) {
  const body = {};
  FIELDS.forEach(f => {
    const el = tr.querySelector(`[data-field="${f}"]`);
    body[f] = el.value || null;
  });
  return body;
}

async function saveEntry(id, btn) {
  const tr = btn.closest("tr");
  const body = readRow(tr);
  try {
    const res = await fetch(`${API_BASE}/security-master/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert("Fehler beim Speichern: " + (err.error || res.status));
      return;
    }
    btn.textContent = "Gespeichert ✓";
    setTimeout(() => { btn.textContent = "Speichern"; }, 1500);
  } catch (err) {
    alert("Verbindungsfehler beim Speichern: " + err.message);
  }
}

async function createEntry() {
  const body = {};
  FIELDS.forEach(f => {
    body[f] = document.getElementById(f).value || null;
  });
  try {
    const res = await fetch(`${API_BASE}/security-master`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert("Fehler beim Speichern: " + (err.error || res.status));
      return;
    }
    loadData();
  } catch (err) {
    alert("Verbindungsfehler beim Speichern: " + err.message);
  }
}

async function deleteEntry(id) {
  if (!confirm("Wirklich löschen?")) return;
  await fetch(`${API_BASE}/security-master/${id}`, { method: "DELETE", credentials: "include" });
  loadData();
}
</script>
</body>
</html>
